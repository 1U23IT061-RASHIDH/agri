<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics | Digital Agri Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="assets/images-integration.css" />
</head>
<body data-page="analytics" data-auth="required" data-roles="FARMER,BUYER,ADMIN">
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-wrap">
      <header class="topbar" id="app-topbar"></header>
      <main class="page">
        <div class="page-header">
          <div>
            <h1 class="page-title">Analytics</h1>
            <p class="page-sub">Real-time insights built from your orders and product data</p>
          </div>
        </div>
        <div class="grid stats">
          <div class="card stat-card info">
            <div class="stat-icon">🧾</div>
            <h3>Total Orders</h3>
            <p id="an-orders">0</p>
          </div>
          <div class="card stat-card amber">
            <div class="stat-icon">💰</div>
            <h3>Total Sales</h3>
            <p id="an-sales">₹0</p>
          </div>
        </div>
        <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px">
          <div class="card"><h3>Order trends</h3><canvas id="trend-chart"></canvas></div>
          <div class="card"><h3>Product demand</h3><canvas id="demand-chart"></canvas></div>
        </div>
        <div class="grid" style="grid-template-columns:1fr 1fr 1fr;margin-top:16px">
          <div class="card"><h3>Best-selling products</h3><div id="best-list"></div></div>
          <div class="card"><h3>Farmer sales</h3><div id="farmer-sales"></div></div>
          <div class="card"><h3>Buyer activity</h3><div id="buyer-activity"></div></div>
        </div>
        <div id="ai-note" style="margin-top:16px"></div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/images-init.js"></script>
</body>
</html>

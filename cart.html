<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart | Digital Agri Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="assets/images-integration.css" />
</head>
<body data-page="cart" data-auth="required" data-roles="BUYER">
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-wrap">
      <header class="topbar" id="app-topbar"></header>
      <main class="page">
        <div class="page-header">
          <div>
            <h1 class="page-title">My Cart</h1>
            <p class="page-sub">Review your selected produce before placing an order</p>
          </div>
          <a class="btn btn-ghost" href="marketplace.html" id="continue-shopping-btn">← Continue Shopping</a>
        </div>
        <div id="cart-root"></div>
      </main>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/images-init.js"></script>
</body>
</html>

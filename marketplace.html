<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marketplace | Digital Agri Marketplace</title>
  <meta name="description" content="Browse fresh agricultural produce from verified farmers and FPOs across India." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="assets/images-integration.css" />
</head>
<body data-page="marketplace" data-auth="optional">
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-wrap">
      <header class="topbar" id="app-topbar"></header>
      <main class="page">
        <div class="page-header">
          <div>
            <h1 class="page-title">Marketplace</h1>
            <p class="page-sub">Fresh produce listed directly by farmers and FPOs — live from LocalStorage</p>
          </div>
        </div>

        <!-- Filters toolbar -->
        <div class="toolbar">
          <input id="search" type="search" placeholder="🔍  Search produce, farmer, location…" style="flex:2;min-width:200px" />
          <select id="category"><option value="">All categories</option></select>
          <select id="location"><option value="">All locations</option></select>
          <input id="min-price" type="number" min="0" placeholder="Min ₹" style="max-width:100px" />
          <input id="max-price" type="number" min="0" placeholder="Max ₹" style="max-width:100px" />
          <select id="sort">
            <option value="newest">Newest first</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
          </select>
        </div>

        <!-- Product grid — rendered by marketplace.js -->
        <div id="product-grid" class="grid product-grid"></div>
      </main>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/marketplace.js"></script>
  <script src="js/images-init.js"></script>
</body>
</html>

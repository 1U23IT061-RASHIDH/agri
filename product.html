<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product | Digital Agri Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="assets/images-integration.css" />
</head>
<body data-page="product" data-auth="optional">
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-wrap">
      <header class="topbar" id="app-topbar"></header>
      <main class="page">
        <div id="product-root"></div>
      </main>
    </div>
  </div>
  <div class="modal-backdrop" id="nego-modal">
    <div class="modal">
      <h3>Negotiate / contact seller</h3>
      <form id="nego-form">
        <div class="field"><label>Product</label><input id="nego-product" readonly /></div>
        <div class="field"><label>Quantity</label><input id="nego-qty" type="number" min="1" /><div class="field-error"></div></div>
        <div class="field"><label>Proposed price (per unit)</label><input id="nego-price" type="number" min="1" step="0.01" /><div class="field-error"></div></div>
        <div class="field"><label>Message</label><textarea id="nego-msg"></textarea><div class="field-error"></div></div>
        <button class="btn btn-primary" type="submit">Send offer</button>
        <button class="btn btn-ghost" type="button" data-close-modal="nego-modal">Cancel</button>
      </form>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/product.js"></script>
  <script src="js/images-init.js"></script>
</body>
</html>
